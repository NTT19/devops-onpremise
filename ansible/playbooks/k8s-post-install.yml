# playbooks/k8s-post-install.yml
# Post-installation configuration
- name: Configure cluster post-installation
  hosts: k8s_control_plane
  become: yes
  tasks:
    - name: Install metrics-server
      ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
      changed_when: true

    - name: Read metrics-server args
      ansible.builtin.command:
        cmd: kubectl -n kube-system get deploy metrics-server -o jsonpath='{.spec.template.spec.containers[0].args}'
      register: metrics_args
      changed_when: false
      failed_when: false

    - name: Patch metrics-server args
      ansible.builtin.command:
        cmd: >
          kubectl -n kube-system patch deployment metrics-server --type='json'
          -p='[
          {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"},
          {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP"}
          ]'
      when:
        - metrics_args.rc == 0
        - "'--kubelet-insecure-tls' not in metrics_args.stdout"
      changed_when: true

    - name: Create namespaces
      ansible.builtin.shell: |
        kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
      loop:
        - production
        - staging
        - monitoring
      changed_when: true

    - name: Copy kubeconfig to local machine
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "~/.kube/config-{{ cluster_name }}"
        flat: yes