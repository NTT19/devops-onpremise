all:
  hosts:
    master:
      ansible_host: 192.168.0.110
      node_ip: 192.168.0.110
      ansible_user: vagrant
      ansible_ssh_private_key_file: ../infrastructure/vagrant/.vagrant/machines/master/virtualbox/private_key

    worker1:
      ansible_host: 192.168.0.111
      node_ip: 192.168.0.111
      ansible_user: vagrant
      ansible_ssh_private_key_file: ../infrastructure/vagrant/.vagrant/machines/worker1/virtualbox/private_key

    worker2:
      ansible_host: 192.168.0.112
      node_ip: 192.168.0.112
      ansible_user: vagrant
      ansible_ssh_private_key_file: ../infrastructure/vagrant/.vagrant/machines/worker2/virtualbox/private_key

    server:
      ansible_host: 192.168.0.113
      node_ip: 192.168.0.113
      ansible_user: vagrant
      ansible_ssh_private_key_file: ../infrastructure/vagrant/.vagrant/machines/server/virtualbox/private_key
      ansible_python_interpreter: /usr/bin/python3

  children:
    k8s_cluster:
      children:
        k8s_control_plane:
          hosts:
            master:

        k8s_workers:
          hosts:
            worker1:
            worker2:

    sqlserver_nodes:
      hosts:
        server: