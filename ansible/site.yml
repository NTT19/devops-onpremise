---
# Top-level playbook to deploy the full Kubernetes cluster

- name: Deploy Kubernetes cluster
  import_playbook: playbooks/kubernetes-cluster.yml

- name: Post-install cluster configuration
  import_playbook: playbooks/k8s-post-install.yml

- name: Tune SQL Server host
  import_playbook: playbooks/tune-sqlserver-linux.yml

- name: Install SQL Server
  import_playbook: playbooks/install-sqlserver.yml

- name: Install SQL Server tools
  import_playbook: playbooks/install-sqlserver-tools.yml

- name: Configure SQL Server
  import_playbook: playbooks/configure-sqlserver.yml

- name: Create SQL Server databases and users
  import_playbook: playbooks/create-databases.yml

- name: Verify SQL Server installation
  import_playbook: playbooks/verify-sqlserver.yml
