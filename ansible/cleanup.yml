---
# ==========================================================
# cleanup.yml
# Refactor chuẩn senior - Safe / Idempotent / Reusable
# ==========================================================

# Chạy:
# ansible-playbook -i inventory/hosts.yml cleanup.yml
# ansible-playbook -i inventory/hosts.yml cleanup.yml --tags k8s
# ansible-playbook -i inventory/hosts.yml cleanup.yml --tags jenkins
# ansible-playbook -i inventory/hosts.yml cleanup.yml --tags sql
# ansible-playbook -i inventory/hosts.yml cleanup.yml -e cleanup_reboot=true

# ==========================================================
# PRECHECK
# ==========================================================
- name: Cleanup precheck
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Display warning
      debug:
        msg:
          - "⚠️ FULL CLEANUP MODE"
          - "This will remove Kubernetes / Jenkins / SQL Server"
          - "Host: {{ inventory_hostname }}"

# ==========================================================
# KUBERNETES CLEANUP
# ==========================================================
- name: Cleanup Kubernetes nodes
  hosts: k8s_cluster
  become: yes
  gather_facts: no
  tags: k8s

  tasks:

    - name: Reset kubeadm
      shell: kubeadm reset -f
      ignore_errors: yes

    - name: Stop kubelet
      systemd:
        name: kubelet
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Unhold Kubernetes packages
      shell: apt-mark unhold kubeadm kubelet kubectl
      ignore_errors: yes

    - name: Remove Kubernetes packages
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Remove Kubernetes directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /var/lib/kubelet
        - /var/lib/etcd
        - /etc/cni
        - /opt/cni
        - /var/lib/cni
        - /var/lib/calico
        - /var/lib/weave
        - /run/flannel
        - /etc/systemd/system/kubelet.service.d
        - /root/.kube
        - /home/vagrant/.kube
      ignore_errors: yes

    - name: Remove CNI interfaces
      shell: |
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        ip link delete weave || true
        ip link delete cali0 || true
      ignore_errors: yes

    - name: Flush iptables (lab only)
      shell: |
        iptables -F || true
        iptables -t nat -F || true
        iptables -t mangle -F || true
        iptables -X || true
      ignore_errors: yes

# ==========================================================
# CONTAINER RUNTIME CLEANUP
# ==========================================================
- name: Cleanup container runtime
  hosts: k8s_cluster
  become: yes
  gather_facts: no
  tags: k8s

  tasks:

    - name: Stop docker/containerd
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - docker
        - containerd
      ignore_errors: yes

    - name: Remove container runtime packages
      apt:
        name:
          - docker.io
          - docker-ce
          - docker-ce-cli
          - containerd
          - containerd.io
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Remove runtime directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/docker
        - /var/lib/containerd
        - /etc/docker
        - /etc/containerd
      ignore_errors: yes

# ==========================================================
# JENKINS CLEANUP
# ==========================================================
- name: Cleanup Jenkins
  hosts: jenkins
  become: yes
  gather_facts: no
  tags: jenkins

  tasks:

    - name: Stop Jenkins
      systemd:
        name: jenkins
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove Jenkins package
      apt:
        name: jenkins
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Remove Jenkins directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/jenkins
        - /var/cache/jenkins
        - /var/log/jenkins
        - /etc/default/jenkins
      ignore_errors: yes

    - name: Remove Java
      shell: apt remove -y openjdk* || true
      ignore_errors: yes

    - name: Remove Jenkins repo
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.list
        - /usr/share/keyrings/jenkins-keyring.asc
      ignore_errors: yes

# ==========================================================
# SQL SERVER CLEANUP
# ==========================================================
- name: Cleanup SQL Server
  hosts: sqlserver_nodes
  become: yes
  gather_facts: no
  tags: sql

  tasks:

    - name: Stop SQL Server
      systemd:
        name: mssql-server
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove SQL packages
      apt:
        name:
          - mssql-server
          - mssql-tools
          - mssql-tools18
          - unixodbc-dev
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Remove SQL directories
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/opt/mssql
        - /opt/mssql
        - /opt/mssql-tools
        - /opt/mssql-tools18
      ignore_errors: yes

    - name: Remove SQL repo files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/mssql-server.list
        - /etc/apt/sources.list.d/mssql-tools.list
        - /etc/profile.d/mssql-tools.sh
      ignore_errors: yes

# ==========================================================
# FINAL SYSTEM CLEANUP
# ==========================================================
- name: Final cleanup
  hosts: all
  become: yes
  gather_facts: no
  tags: always

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
      ignore_errors: yes

    - name: Autoremove packages
      apt:
        autoremove: yes
        purge: yes
      ignore_errors: yes

    - name: Clean apt cache
      apt:
        autoclean: yes
      ignore_errors: yes

    - name: Reboot if requested
      reboot:
        reboot_timeout: 300
      when: cleanup_reboot | default(false) | bool

# ==========================================================
# LOCAL CLEANUP
# ==========================================================
- name: Cleanup local files
  hosts: localhost
  connection: local
  gather_facts: no
  tags: always

  tasks:

    - name: Remove join command file
      file:
        path: "{{ playbook_dir }}/k8s-join-command"
        state: absent
      ignore_errors: yes

    - name: Completed message
      debug:
        msg:
          - "✅ CLEANUP COMPLETED"
          - "Kubernetes removed"
          - "Jenkins removed"
          - "SQL Server removed"
          - "Ready for redeploy"