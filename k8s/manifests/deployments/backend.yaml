apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ntt1902/shoesstore-backend:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: backend-config